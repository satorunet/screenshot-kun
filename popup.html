<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
:root{--bg:#fff;--fg:#0f1419;--mut:#536471;--ln:#e5e9eb;--a:#1d9bf0;--r:#e0245e;--card:#f7f9f9}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--fg:#e7e9ea;--mut:#8b98a5;--ln:#2f3336;--a:#1d9bf0;--r:#f4245e;--card:#1e2328}}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
.w{padding:14px}
h1{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
#album{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:999px;padding:3px 12px;cursor:pointer}
#album:hover{border-color:var(--a)}
.dest{display:flex;align-items:center;gap:8px;margin:2px 0 0;color:var(--mut);font-size:12px}
.dest select{flex:1}
h2{font-size:13px;color:var(--fg);font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
h2 .ic{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
h2 .ic svg{width:16px;height:16px}
h2 .ic.still{background:var(--a)}
h2 .ic.video{background:var(--r)}
.seg{display:flex;border:1px solid var(--ln);border-radius:999px;padding:3px;margin:0 0 6px;background:var(--card)}
.seg label{flex:1;text-align:center;cursor:pointer;border-radius:999px;padding:4px 0;font-weight:600;color:var(--mut)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--fg);color:var(--bg)}
#fmtNote{color:var(--mut);font-size:11px;margin:0 0 8px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btns.two{grid-template-columns:repeat(2,1fr)}
.btns button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;font-size:12.5px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.btns button:hover{border-color:var(--a)}
.btns button:disabled{opacity:.45;cursor:default}
.btns svg{width:26px;height:26px}
.btns.video button:hover{border-color:var(--r)}
.btns small{font-weight:400;color:var(--mut);font-size:10.5px}
#recbox{display:none;margin-top:8px}
#recbox.on{display:block}
#stop{width:100%;padding:11px;border:0;border-radius:999px;background:var(--r);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
#stop i{display:inline-block;width:10px;height:10px;background:#fff;border-radius:2px;margin-right:8px}
#rectext{color:var(--mut);text-align:center;margin-top:4px}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .3s}
.bar.ind i{width:30%;animation:mv 1s infinite linear}
@keyframes mv{from{margin-left:-30%}to{margin-left:100%}}
button.cancel{width:100%;margin-top:6px;padding:6px;border:1px solid var(--ln);border-radius:999px;background:none;color:var(--fg);cursor:pointer}
#msg{color:var(--mut);min-height:1.5em;margin-top:8px;word-break:break-all}
details{margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
summary{cursor:pointer;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.row label{flex:1}
select,input[type=number]{background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:3px 6px;font:inherit}
input[type=number]{width:90px}
input[type=range]{width:120px}
.hint{color:var(--mut);font-size:11px;margin:2px 0 0}
.hide{display:none}
.row.off{opacity:.4}
</style></head><body><div class="w">
<h1>スクショくん <button id="album" title="保存の履歴を開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>履歴</button></h1>


<h2><span class="ic still"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5"/></svg></span>静止画で保存</h2>
<div class="seg" id="fmt">
  <label><input type="radio" name="format" value="pdf"><span>PDF</span></label>
  <label><input type="radio" name="format" value="html"><span>HTML</span></label>
  <label><input type="radio" name="format" value="image"><span>画像</span></label>
  <label><input type="radio" name="format" value="print"><span>印刷</span></label>
</div>
<p id="fmtNote"></p>
<div class="btns still">
  <button data-mode="full" title="自動でスクロールしてページの最初から最後まで"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 7v9m-3-3 3 3 3-3"/></svg>ページ全体<small>自動スクロール</small></button>
  <button data-mode="visible" title="いま画面に見えている部分"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg>表示部分<small>見えている所</small></button>
  <button data-mode="area" title="ページ上をドラッグして範囲を選ぶ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.5"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>選択範囲<small>ドラッグで指定</small></button>
</div>

<h2><span class="ic video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z" stroke-linejoin="round"/></svg></span>動画で保存</h2>
<div class="btns two video">
  <button data-vmode="visible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><circle cx="12" cy="11" r="3" fill="currentColor" stroke="none"/></svg>表示部分を録画<small>タブの画面と音</small></button>
  <button data-vmode="area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="3 2.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>範囲を録画<small>ドラッグで指定</small></button>
</div>
<div id="recbox"><button id="stop"><i></i>録画を停止して保存 <span id="clock">0:00</span></button><div id="rectext"></div></div>

<div id="prog" class="hide">
  <div class="bar" id="bar"><i id="fill"></i></div>
  <button class="cancel" id="cancel">中止</button>
</div>
<div id="msg"></div>

<details id="opt"><summary>設定</summary>
  <div class="row"><label for="history"><b>履歴に残す</b>（履歴機能）</label><input type="checkbox" id="history"></div>
  <div class="row"><label for="preview">保存したらその場で表示</label><input type="checkbox" id="preview"></div>
  <div class="row" id="destRow"><label for="dest">保存先</label>
    <select id="dest"><option value="both">ダウンロード ＋ 履歴</option><option value="download">ダウンロードだけ</option><option value="album">履歴だけ</option></select></div>
  <div class="row"><label for="imgfmt">画像の形式</label>
    <select id="imgfmt"><option value="webp">WebP（小さい・おすすめ）</option><option value="png">PNG（どこでも開ける）</option><option value="jpg">JPEG（小さい・少し劣化）</option></select></div>
  <div class="row"><label for="imgq">画質</label>
    <select id="imgq"><option value="lossless">劣化なし（おすすめ）</option><option value="high">高画質（少し軽い）</option><option value="small">軽量（ファイルを小さく）</option></select></div>
  <div class="row"><label for="res">解像度</label>
    <select id="res"><option value="device">画面そのまま（おすすめ）</option><option value="1">1x（軽い）</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div>
  <div class="row" id="pageRow"><label for="page">PDF の 1 ページの形</label>
    <select id="page"><option value="a4">A4 縦</option><option value="letter">レター</option><option value="long">縦長（A4 の 2 倍）</option></select></div>
  <div class="row"><label for="smartCut">ページの切れ目を余白に合わせる</label><input type="checkbox" id="smartCut"></div>
  <div class="row"><label for="hideFixed">固定ヘッダーは 1 枚目だけ写す</label><input type="checkbox" id="hideFixed"></div>
  <div class="row"><label for="delay">スクロール後の待ち (ms)</label><input type="number" id="delay" min="550" step="50"></div>
  <div class="row"><label for="bottomWait">最下部の読み込み待ち (ms)</label><input type="number" id="bottomWait" min="0" step="100"></div>
  <div class="row"><label for="maxHeight">最大の長さ (px, 0=無制限)</label><input type="number" id="maxHeight" min="0" step="10000"></div>
  <p class="hint">無限スクロールのページは「最大の長さ」で止めてください。</p>
  <div class="row"><label for="splitMB">1 ファイルの上限（超えたら自動で分割）</label>
    <select id="splitMB"><option value="200">200 MB</option><option value="500">500 MB</option><option value="1024">1 GB</option><option value="2048">2 GB</option></select></div>
  <div class="row"><label for="audio">録画でタブの音も録る</label><input type="checkbox" id="audio"></div>
  <div class="row"><label for="saveAs">毎回保存先を選ぶ</label><input type="checkbox" id="saveAs"></div>
  <div class="row"><label for="lang">言語 / Language</label>
    <select id="lang"><option value="auto">自動（ブラウザに合わせる）</option><option value="ja">日本語</option><option value="en">English</option></select></div>
  <p class="hint">ショートカット Alt+Shift+P：ページ全体を保存（録画中は停止）</p>
</details>
</div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body></html>
