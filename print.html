<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印刷 — スクショくん</title>
<link rel="icon" href="icon.png">
<style id="pagecss">@page{size:A4 portrait;margin:8mm}</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8eaed;font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;color:#202124}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #dadce0}
.bar img{width:22px;height:22px}
.bar b{font-size:15px}
.bar .sp{flex:1}
.bar span{color:#5f6368}
.bar button{font:inherit;font-weight:700;border:0;border-radius:999px;background:#1a73e8;color:#fff;padding:8px 18px;cursor:pointer}
.bar select{font:inherit;padding:4px 6px;border:1px solid #dadce0;border-radius:6px}
#doc{padding:20px 0 60px}
.sheet{margin:0 auto 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hd{box-sizing:border-box;padding:0 2mm;font-size:9pt;line-height:7mm;color:#444;border-bottom:.3mm solid #ccc;margin:0 0 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hd b{color:#000}
.pg{position:relative;overflow:hidden;width:100%}
.pg img{position:absolute;left:0;width:100%;height:auto;display:block}
.note{width:194mm;margin:0 auto 16px;color:#5f6368}
@media print{
  body{background:#fff}
  .bar,.note{display:none}
  #doc{padding:0}
  .sheet{margin:0;box-shadow:none;break-after:page;break-inside:avoid}
  .sheet:last-child{break-after:auto}
}
</style></head>
<body>
<div class="bar"><img src="icon.png" alt=""><b>印刷用ページ</b><span id="info">読み込み中…</span><span class="sp"></span>
  <label>用紙 <select id="paper"><option value="a4">A4</option><option value="letter">レター</option></select></label>
  <button id="go">印刷する</button></div>
<div id="doc"></div>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="print.js"></script>
</body></html>
