<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>履歴 — スクショくん</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#fff;--fg:#0f1419;--mut:#536471;--ln:#e5e9eb;--a:#1d9bf0;--r:#e0245e;--card:#f7f9f9;--sel:#e8f5fe}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--fg:#e7e9ea;--mut:#8b98a5;--ln:#2f3336;--card:#171b1f;--sel:#0d2a3f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{max-width:1200px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0;display:flex;align-items:center;gap:8px}
h1 img{width:24px;height:24px}
#stat{color:var(--mut);font-size:12px}
.sp{flex:1}
input[type=search]{min-width:200px;flex:1 1 220px;max-width:380px;padding:6px 12px;border:1px solid var(--ln);border-radius:999px;background:var(--card);color:var(--fg);font:inherit}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button,.view button,.bar button{font:inherit;font-size:13px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer}
.chips button.on,.view button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.view{display:flex;gap:4px}
.bar{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:none;gap:8px;align-items:center}
.bar.on{display:flex}
.bar b{margin-right:6px}
.bar button.del{border-color:var(--r);color:var(--r)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--fg)}
th .ar{font-size:10px;margin-left:3px}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr.item:hover{background:var(--card)}
tr.item.sel{background:var(--sel)}
td.th{width:112px}
.thumb{width:96px;height:72px;border-radius:6px;background:var(--card) center/cover no-repeat;border:1px solid var(--ln);cursor:pointer;display:block;position:relative}
.thumb .dur{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
.ttl{font-weight:600;display:block;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.url{color:var(--a);font-size:12px;display:block;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;color:#fff}
.b-pdf{background:#d93025}.b-html{background:#e37400}.b-img{background:#188038}.b-video{background:#7b1fa2}
.mode{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.date,.size{white-space:nowrap;font-variant-numeric:tabular-nums}
.date small{color:var(--mut);display:block}
.act{white-space:nowrap}
.act button{font:inherit;font-size:12px;border:1px solid var(--ln);background:none;color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer;margin-left:2px}
.act button:hover{border-color:var(--a)}
.act button.del:hover{border-color:var(--r);color:var(--r)}
input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--card);position:relative}
.card.sel{outline:2px solid var(--a)}
.card .thumb{width:100%;height:160px;border:0;border-radius:0}
.card .cb{position:absolute;left:8px;top:8px}
.card .badge{position:absolute;right:8px;top:8px}
.card .meta{padding:8px 10px}
.card .ttl,.card .url{max-width:100%}
.card .date{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:80px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){.hide-s{display:none}}
.lb{position:fixed;inset:0;z-index:50;background:#111;display:none;flex-direction:column}
.lb.on{display:flex}
.lbbar{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;background:rgba(0,0,0,.5)}
.lbbar .info{min-width:0;flex:1}
.lbbar .lt{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbbar .ls{font-size:12px;color:#aab;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbbar .ls a{color:#8ab4f8}
.lbbar button{font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.lbbar button:hover{background:rgba(255,255,255,.2)}
.lbbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;position:relative}
.lbbody.center{align-items:center}
.lbbody img{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff}
.lbbody.fit img{max-height:100%;width:auto;object-fit:contain}
.lbbody .stack{width:100%;max-width:var(--mw,100%)}
.lbbody .stack img{width:100%;max-height:none}
.lbbody video{max-width:100%;max-height:100%;background:#000}
.lbbody iframe{width:100%;height:100%;border:0;background:#fff}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:26px;cursor:pointer;z-index:51}
.nav:hover{background:rgba(0,0,0,.8)}
#lbPrev{left:10px}#lbNext{right:10px}
.lbload{color:#ccc;margin:auto}

</style></head>
<body>
<header>
  <div class="top">
    <h1><img src="icon.png" alt="">保存の履歴</h1>
    <span id="stat"></span>
    <span class="sp"></span>
    <input type="search" id="q" placeholder="タイトル・URL で絞り込み">
    <div class="chips" id="kinds">
      <button data-k="" class="on">すべて</button><button data-k="pdf">PDF</button><button data-k="html">HTML</button><button data-k="img">画像</button><button data-k="video">動画</button>
    </div>
    <div class="view"><button data-v="list" class="on" title="一覧">☰ 一覧</button><button data-v="grid" title="サムネイル">▦ サムネ</button></div>
  </div>
  <div class="bar" id="bar"><b id="selN"></b><button id="bDl">ダウンロード</button><button id="bPr">印刷</button><button id="bDel" class="del">削除</button><button id="bNone">選択を解除</button></div>
</header>
<main id="main"></main>
<div class="lb" id="lb">
  <div class="lbbar"><div class="info"><span class="lt" id="lbT"></span><span class="ls" id="lbS"></span></div>
    <button id="lbFit" title="画面に合わせる／幅に合わせる（F）">全体表示</button><button id="lbTab">新しいタブで開く</button><button id="lbDl">保存</button><button id="lbX" title="閉じる（Esc）">✕</button></div>
  <div class="lbbody" id="lbBody"></div>
  <button class="nav" id="lbPrev" title="前へ（←）">‹</button><button class="nav" id="lbNext" title="次へ（→）">›</button>
</div>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="history.js"></script>
</body></html>
